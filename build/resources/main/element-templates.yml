# element-templates.yml (extreme version)
# ID format: TEMPLATE_<ELEMENT>_<TYPE>
# Opposites and pairs are encoded symmetrically (e.g., FIRE <-> WATER, LIGHTNESS <-> DARKNESS).

templates:

  # =========================
  # FIRE
  # =========================
  TEMPLATE_FIRE_NORMAL:
    modifiers:
      ELEMENT_FIRE: 0.25          # self (strong resist)
      ELEMENT_ICE: 0.50           # resist
      ELEMENT_WATER: 2.00         # primary vuln (opposite)
      ELEMENT_EARTH: 1.50         # secondary vuln

  TEMPLATE_FIRE_BOSS:
    modifiers:
      ELEMENT_FIRE: 0.00          # immune to self
      ELEMENT_ICE: 0.25
      ELEMENT_WATER: 1.50
      ELEMENT_EARTH: 1.25

  # =========================
  # WATER
  # =========================
  TEMPLATE_WATER_NORMAL:
    modifiers:
      ELEMENT_WATER: 0.25
      ELEMENT_FIRE: 0.50
      ELEMENT_THUNDER: 2.00       # primary vuln
      ELEMENT_ICE: 1.50           # secondary vuln

  TEMPLATE_WATER_BOSS:
    modifiers:
      ELEMENT_WATER: 0.00
      ELEMENT_FIRE: 0.25
      ELEMENT_THUNDER: 1.50
      ELEMENT_ICE: 1.25

  # =========================
  # EARTH
  # =========================
  TEMPLATE_EARTH_NORMAL:
    modifiers:
      ELEMENT_EARTH: 0.25
      ELEMENT_THUNDER: 0.50
      ELEMENT_WATER: 2.00         # primary vuln
      ELEMENT_WIND: 1.50          # secondary vuln

  TEMPLATE_EARTH_BOSS:
    modifiers:
      ELEMENT_EARTH: 0.00
      ELEMENT_THUNDER: 0.25
      ELEMENT_WATER: 1.50
      ELEMENT_WIND: 1.25

  # =========================
  # WIND
  # =========================
  TEMPLATE_WIND_NORMAL:
    modifiers:
      ELEMENT_WIND: 0.25
      ELEMENT_EARTH: 0.50
      ELEMENT_ICE: 2.00           # primary vuln
      ELEMENT_THUNDER: 1.50       # secondary vuln

  TEMPLATE_WIND_BOSS:
    modifiers:
      ELEMENT_WIND: 0.00
      ELEMENT_EARTH: 0.25
      ELEMENT_ICE: 1.50
      ELEMENT_THUNDER: 1.25

  # =========================
  # ICE
  # =========================
  TEMPLATE_ICE_NORMAL:
    modifiers:
      ELEMENT_ICE: 0.25
      ELEMENT_WIND: 0.50
      ELEMENT_FIRE: 2.00          # primary vuln
      ELEMENT_EARTH: 1.50         # secondary vuln

  TEMPLATE_ICE_BOSS:
    modifiers:
      ELEMENT_ICE: 0.00
      ELEMENT_WIND: 0.25
      ELEMENT_FIRE: 1.50
      ELEMENT_EARTH: 1.25

  # =========================
  # THUNDER
  # =========================
  TEMPLATE_THUNDER_NORMAL:
    modifiers:
      ELEMENT_THUNDER: 0.25
      ELEMENT_WIND: 0.50
      ELEMENT_EARTH: 2.00         # primary vuln
      ELEMENT_ICE: 1.50           # secondary vuln

  TEMPLATE_THUNDER_BOSS:
    modifiers:
      ELEMENT_THUNDER: 0.00
      ELEMENT_WIND: 0.25
      ELEMENT_EARTH: 1.50
      ELEMENT_ICE: 1.25

  # =========================
  # LIGHTNESS
  # (direct opposite with DARKNESS)
  # =========================
  TEMPLATE_LIGHTNESS_NORMAL:
    modifiers:
      ELEMENT_LIGHTNESS: 0.25
      ELEMENT_DARKNESS: 2.00

  TEMPLATE_LIGHTNESS_BOSS:
    modifiers:
      ELEMENT_LIGHTNESS: 0.00
      ELEMENT_DARKNESS: 1.50

  # =========================
  # DARKNESS
  # (direct opposite with LIGHTNESS)
  # =========================
  TEMPLATE_DARKNESS_NORMAL:
    modifiers:
      ELEMENT_DARKNESS: 0.25
      ELEMENT_LIGHTNESS: 2.00

  TEMPLATE_DARKNESS_BOSS:
    modifiers:
      ELEMENT_DARKNESS: 0.00
      ELEMENT_LIGHTNESS: 1.50
