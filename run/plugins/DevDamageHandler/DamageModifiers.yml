Stacking:
  damage-types:
    primary-order: [MAGIC, PHYSICAL, UNARMED]
    flag-types: [WEAPON, PROJECTILE, SKILL, DOT, MINION, ON_HIT]
    flags-affect-primary: true
    combine-mode: SOFT_ADD   # PRODUCT | MIN | MAX | AVERAGE | SOFT_ADD | RESIST_ADD

  elements:
    combine-mode: PRODUCT
    immune-indicator: true
    immune-format: "<gray>IMMUNE"
    crit-stat: "CRITICAL_STRIKE_POWER"

Modifiers:
  DUMMY:
    Stacking:
      damage-types:
        combine-mode: SOFT_ADD       # override only this, others fall back
        flags-affect-primary: true
      elements:
        combine-mode: PRODUCT
    Elements:
      FIRE: 0.5
      WATER: 0.0
    DamageTypes:
      PHYSICAL: 1.0
      SKILL: 0.25
      MAGIC: 0.25

  BOSS_01:
    Stacking:
      damage-types:
        combine-mode: MIN
        flags-affect-primary: false
    Elements:
      FIRE: 0.2
    DamageTypes:
      MAGIC: 0.4
